plugins {
    id 'java-library'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'shared library'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    if (providers.gradleProperty('useMavenLocalRepo').map { it.toBoolean() }.getOrElse(false)) {
        mavenLocal()
    }
    // Only consulted for snapshot versions, e.g. 4.2.0-SNAPSHOT
    maven {
        url = 'https://repo.spring.io/snapshot'
        mavenContent { snapshotsOnly() }
    }
    mavenCentral()
}

dependencies {
    implementation(platform(libs.spring.boot.dependencies))
    // Align alpha OpenTelemetry artifacts with the API version, see libs.versions.toml
    implementation(platform(libs.opentelemetry.bom.alpha))

    implementation('ch.qos.logback:logback-core')
    implementation libs.opentelemetry.logback.appender
    implementation('io.opentelemetry:opentelemetry-api')
    implementation('io.micrometer:micrometer-tracing')
    implementation('jakarta.servlet:jakarta.servlet-api')
    implementation('org.slf4j:slf4j-api')
    implementation('org.springframework:spring-context')
    implementation('io.micrometer:micrometer-core')
    implementation('org.springframework:spring-web')
}

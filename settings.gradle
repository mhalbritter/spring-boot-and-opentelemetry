pluginManagement {
    repositories {
        if (providers.gradleProperty('useMavenLocalRepo').map { it.toBoolean() }.getOrElse(false)) {
            mavenLocal()
        }
        // Only consulted for snapshot versions, e.g. 4.2.0-SNAPSHOT
        maven {
            url = 'https://repo.spring.io/snapshot'
            mavenContent { snapshotsOnly() }
        }
        gradlePluginPortal()
    }
}
include "user-service"
include "greeting-service"
include "hello-service"
include "shared"

spring.application.name=greeting-service
server.port=8082
# Services run from their module directory, compose.yaml is in the project root
spring.docker.compose.file=../compose.yaml
logging.level.com.example=debug

# Tracing configuration
spring.task.execution.propagate-context=true
management.observations.annotations.enabled=true
management.observations.conventions=opentelemetry

# For demo only
management.tracing.sampling.probability=1.0
management.otlp.metrics.export.step=10s
